<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f0c">
<title>Troll Wars: Continent of Ruins</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0b0f0c;font-family:Arial,Helvetica,sans-serif;color:#fff}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}.panel{position:absolute;background:rgba(7,10,8,.86);border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.player-panel{left:14px;top:12px;min-width:254px;padding:14px 16px;font-size:15px;line-height:1.55}.bar{height:8px;background:#202522;margin:6px 0 4px;border-radius:4px;overflow:hidden}.bar>div{height:100%;background:#31df72}
.status{position:absolute;right:12px;top:12px;padding:8px 11px;background:rgba(7,10,8,.82);border:1px solid rgba(255,255,255,.14);font-size:11px;letter-spacing:.5px}
.controls{left:14px;bottom:12px;padding:10px 14px;font-size:13px;color:#ddd}.controls b{color:#fff;letter-spacing:2px}
#feed{position:absolute;right:12px;bottom:12px;width:min(390px,42vw);display:flex;flex-direction:column;gap:4px;align-items:flex-end}.feed-item{padding:5px 8px;background:rgba(7,10,8,.72);font-size:11px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#boot-error{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(650px,90vw);padding:20px;background:#250f0f;border:1px solid #e06b6b;color:#fff;font-size:14px;line-height:1.55;text-align:center;display:none;pointer-events:auto}
#home{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(4,7,5,.96),rgba(10,15,10,.9));transition:opacity .35s,visibility .35s}.hidden{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
.grid{position:absolute;inset:-20%;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;transform:perspective(700px) rotateX(58deg) translateY(18%);transform-origin:center bottom;opacity:.45}.noise{position:absolute;inset:0;background:radial-gradient(circle at center,transparent,rgba(0,0,0,.72))}
.home-content{position:relative;z-index:2;text-align:center;width:min(760px,92vw);padding:30px}.kicker{font-size:12px;letter-spacing:7px;color:#c8ad62;margin-bottom:16px}.home-content h1{margin:0;font-size:clamp(70px,11vw,150px);line-height:.78;font-weight:900;letter-spacing:-5px;text-shadow:0 8px 30px #000}.home-content h1 span{color:#d7b45d}.tag{margin:30px 0 34px;color:#b9c0b8;font-size:12px;letter-spacing:4px}.buttons{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.btn{appearance:none;min-width:190px;border:1px solid #e0c36c;background:#c8a94f;color:#111;font:900 14px Arial;letter-spacing:3px;padding:17px 28px;cursor:pointer}.btn.alt{background:rgba(10,14,11,.82);color:#ddd;border-color:rgba(255,255,255,.24)}#home-msg{min-height:18px;margin-top:15px;color:#e57c7c;font-size:10px;letter-spacing:1.5px}
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.74);backdrop-filter:blur(6px)}#modal.show{display:flex}.box{width:min(470px,92vw);padding:28px;background:rgba(7,10,8,.98);border:1px solid rgba(215,180,93,.5);box-shadow:0 20px 60px #000;text-align:center}.box h2{margin:0 0 8px;font-size:26px;letter-spacing:2px}.box p{margin:0 0 22px;color:#9ba29b;font-size:11px;line-height:1.6}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.actions button{appearance:none;border:1px solid #d7b45d;background:#c8a94f;color:#111;font-weight:900;letter-spacing:2px;padding:13px 16px;cursor:pointer}.actions .secondary{background:transparent;color:#ddd;border-color:#555}#join-id{width:100%;margin:0 0 10px;padding:13px;background:#111612;border:1px solid #3c443d;color:#fff;text-align:center;font:700 18px Arial;letter-spacing:5px;text-transform:uppercase;outline:none}#error{min-height:16px;margin-top:12px;color:#e57c7c;font-size:10px;letter-spacing:1px}
#share{position:absolute;right:12px;top:58px;padding:10px 12px;background:rgba(7,10,8,.84);border:1px solid rgba(215,180,93,.45);min-width:190px;pointer-events:auto;z-index:12}#share strong{font-size:18px;letter-spacing:4px;color:#d7b45d}#copy{margin-left:10px;border:1px solid #555;background:#171b17;color:#fff;padding:6px 8px;font-size:9px;cursor:pointer}
@media(max-width:600px){.home-content h1{letter-spacing:-3px}.tag{letter-spacing:2px;line-height:1.7}.player-panel{min-width:210px}.controls{font-size:11px}#feed{width:55vw}}
</style>
</head>
<body>
<div id="game"></div>

<section id="home">
  <div class="grid"></div><div class="noise"></div>
  <div class="home-content">
    <div class="kicker">CONTINENT OF RUINS</div>
    <h1>TROLL<br><span>WARS</span></h1>
    <div class="tag">ENTER THE WILDERNESS. LEAVE YOUR MARK.</div>
    <div class="buttons">
      <button class="btn" id="guest">GUEST SERVER</button>
      <button class="btn alt" id="custom">CUSTOM SERVER</button>
    </div>
    <div id="home-msg"></div>
  </div>
</section>

<section id="modal">
  <div class="box">
    <h2>GUEST SERVER</h2>
    <p>Create a temporary server and share its ID, or join an existing server.</p>
    <div class="actions">
      <button id="solo">SOLO PLAY</button>
      <button id="create">CREATE SERVER</button>
    </div>
    <div style="margin:20px 0 10px;color:#687168;font-size:10px;letter-spacing:2px">JOIN BY SERVER ID</div>
    <input id="join-id" maxlength="6" autocomplete="off" placeholder="ABC123">
    <div class="actions"><button id="join">JOIN SERVER</button><button class="secondary" id="back">BACK</button></div>
    <div id="error"></div>
  </div>
</section>

<section id="hud">
  <div class="panel player-panel">
    <div id="name" style="font-size:20px;font-weight:700">TROLL</div>
    <div>LEVEL <span id="level">1</span></div>
    <div class="bar"><div id="hpbar" style="width:100%"></div></div>
    <div style="font-size:13px">HP <span id="hp">100</span>/<span id="maxhp">100</span></div>
    <div style="font-size:13px" id="exp">EXP 0 / 100</div>
  </div>
  <div class="panel controls"><b>W A S D</b> MOVE &nbsp; <b>SPACE</b> ATTACK &nbsp; <b>B</b> BOMB</div>
  <div class="status" id="status">STARTING<div id="room"></div></div>
  <div id="share" hidden>GUEST SERVER ID<br><strong id="share-id">------</strong><button id="copy">COPY</button></div>
  <div id="boot-error"></div>
  <div id="feed"></div>
</section>

<script>
/*
  GitHub Pages configuration:
  Set this URL to the public address of the Node/Socket.io server.
  Example:
  window.TROLL_WARS_SERVER_URL = "https://your-server.example.com";
*/
window.TROLL_WARS_SERVER_URL = window.TROLL_WARS_SERVER_URL || "";
</script>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
const TILE=32,W=80,H=60,CITADEL=7;
let canvas=document.createElement("canvas"),ctx=canvas.getContext("2d"),world=null,socket=null,myId=null,latest=null;
let localMode=false,started=false,keys={up:false,down:false,left:false,right:false},last=performance.now(),camera={x:0,y:0};
let local={player:{id:"local",name:"Troll_Local",x:1280,y:960,hp:100,maxHp:100,level:1,exp:0,kills:0,deaths:0,alive:true,facing:{x:0,y:1}},players:[],bombs:[],orbs:[],graves:[],effects:[],nextOrb:1};
$("game").appendChild(canvas);

function resize(){canvas.width=innerWidth;canvas.height=innerHeight}addEventListener("resize",resize);resize();
function status(t){$("status").firstChild.textContent=t}
function feed(t){const e=document.createElement("div");e.className="feed-item";e.textContent=t;$("feed").prepend(e);setTimeout(()=>e.remove(),5000)}
function error(t){$("error").textContent=t}
function makeWorld(){const tiles=[];for(let y=0;y<H;y++){tiles[y]=[];for(let x=0;x<W;x++){let d=Math.hypot(x-W/2,y-H/2),v=0,r=Math.random();if(d>=CITADEL){if(r<.07)v=1;else if(r<.14)v=2;else if(r<.17)v=3}tiles[y].push(v)}}return{width:W,height:H,tileSize:TILE,citadelRadius:CITADEL,tiles}}
function spawn(){return{x:W*TILE/2,y:H*TILE/2}}
function inCitadel(x,y){const s=spawn();return Math.hypot(x-s.x,y-s.y)<CITADEL*TILE}
function walk(x,y){const tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);if(tx<0||ty<0||tx>=W||ty>=H)return false;if(inCitadel(x,y))return true;return world.tiles[ty][tx]===0||world.tiles[ty][tx]===4}
function expNeed(l){return 100+(l-1)*50}
function hud(p){if(!p)return;$("name").textContent=p.name;$("level").textContent=p.level;$("hp").textContent=Math.max(0,Math.ceil(p.hp));$("maxhp").textContent=p.maxHp;$("hpbar").style.width=Math.max(0,Math.min(100,p.hp/p.maxHp*100))+"%";$("exp").textContent=`EXP ${p.exp||0} / ${expNeed(p.level)}`}
function showGame(){started=true;$("home").classList.add("hidden");$("modal").classList.remove("show")}
function createLocal(){localMode=true;world=makeWorld();Object.assign(local.player,spawn());local.players=[local.player];$("share").hidden=true;status("GUEST SERVER • SOLO");hud(local.player);feed("🌍 Guest Server solo mode");}
function serverUrl(){return window.TROLL_WARS_SERVER_URL.trim().replace(/\/+$/,"")}
function connect(){
  if(!window.io){status("CLIENT ERROR");return}
  const url=serverUrl();
  if(!url){status("SERVER URL NOT SET");return}
  socket=io(url,{transports:["websocket","polling"],reconnection:true});
  status("CONNECTING...");
  socket.on("connect",()=>{status("SERVER ONLINE");feed("🔌 Connected to Troll Wars Server")});
  socket.on("disconnect",()=>status("DISCONNECTED"));
  socket.on("connect_error",()=>status("SERVER OFFLINE"));
  socket.on("guest:joined",d=>{myId=d.playerId;world=d.world;localMode=false;latest=null;$("room").textContent="ID "+d.roomId;$("share-id").textContent=d.roomId;$("share").hidden=false;status("GUEST SERVER");showGame();feed(`🌍 Joined Guest Server ${d.roomId}`)});
  socket.on("guest:error",d=>{error(d.message||"SERVER ERROR");status("SERVER ERROR")});
  socket.on("state",s=>{latest=s;hud(s.players.find(p=>p.id===myId))});
  socket.on("log",d=>feed(d.text));
  socket.on("terrainDestroyed",d=>{for(const t of d.tiles||[])if(world?.tiles[t.y])world.tiles[t.y][t.x]=4});
  socket.on("attackFx",d=>local.effects.push({type:"attack",x:d.x,y:d.y,dir:d.dir||{x:0,y:1},life:.16,max:.16}));
  socket.on("hitFx",d=>local.effects.push({type:"hit",x:d.x,y:d.y,life:.22,max:.22,damage:d.damage}));
  socket.on("bombExploded",d=>local.effects.push({type:"explosion",x:d.x,y:d.y,life:.45,max:.45}));
  socket.on("orbCollected",d=>feed(`✨ +${d.value} EXP`));
  socket.on("death",()=>feed("☠ You fell. Respawning..."));
}
function sendInput(){if(!socket?.connected||!started)return;socket.emit("input",keys)}
function attack(){if(localMode){local.effects.push({type:"attack",x:local.player.x,y:local.player.y,dir:local.player.facing,life:.16,max:.16});return}socket?.emit("attack")}
function bomb(){if(localMode){local.bombs.push({x:local.player.x,y:local.player.y,timer:2});return}socket?.emit("bomb")}
function createServer(){if(!socket?.connected){error("SERVER IS NOT CONNECTED");return}error("CREATING SERVER...");socket.emit("guest:create")}
function joinServer(){const id=$("join-id").value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(id)){error("ENTER A 6-CHARACTER SERVER ID");return}if(!socket?.connected){error("SERVER IS NOT CONNECTED");return}error("JOINING...");socket.emit("guest:join",id)}
function solo(){createLocal();showGame()}
$("guest").onclick=()=>{$("modal").classList.add("show");error("")};
$("back").onclick=()=>{$("modal").classList.remove("show");error("")};
$("solo").onclick=solo;$("create").onclick=createServer;$("join").onclick=joinServer;
$("custom").onclick=()=>{$("home-msg").textContent="CUSTOM SERVER IS THE NEXT SERVER SYSTEM.";};
$("join-id").onkeydown=e=>{if(e.key==="Enter")joinServer()};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("share-id").textContent);$("copy").textContent="COPIED";setTimeout(()=>$("copy").textContent="COPY",1200)}catch{}};

addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(["w","a","s","d"," ","b"].includes(k))e.preventDefault();if(k==="w")keys.up=true;if(k==="s")keys.down=true;if(k==="a")keys.left=true;if(k==="d")keys.right=true;if(k===" "&&!e.repeat)attack();if(k==="b"&&!e.repeat)bomb()});
addEventListener("keyup",e=>{const k=e.key.toLowerCase();if(k==="w")keys.up=false;if(k==="s")keys.down=false;if(k==="a")keys.left=false;if(k==="d")keys.right=false});

function updateLocal(dt){
 let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);
 if(dx||dy){if(dx&&dy){dx*=Math.SQRT1_2;dy*=Math.SQRT1_2}local.player.facing={x:dx,y:dy};let nx=local.player.x+dx*252*dt,ny=local.player.y+dy*252*dt;if(walk(nx,local.player.y))local.player.x=nx;if(walk(local.player.x,ny))local.player.y=ny}
 for(const b of local.bombs)b.timer-=dt;
 const ex=local.bombs.filter(b=>b.timer<=0);local.bombs=local.bombs.filter(b=>b.timer>0);
 for(const b of ex){const r=96;for(let y=Math.max(0,Math.floor((b.y-r)/TILE));y<=Math.min(H-1,Math.floor((b.y+r)/TILE));y++)for(let x=Math.max(0,Math.floor((b.x-r)/TILE));x<=Math.min(W-1,Math.floor((b.x+r)/TILE));x++){let cx=x*TILE+16,cy=y*TILE+16;if(Math.hypot(cx-b.x,cy-b.y)<=r&&!inCitadel(cx,cy))world.tiles[y][x]=4}local.effects.push({type:"explosion",x:b.x,y:b.y,life:.45,max:.45});feed("💥 The ground was destroyed")}
 if(local.orbs.length<18&&Math.random()<dt*1.4){let x,y;for(let i=0;i<40;i++){x=80+Math.random()*(W*TILE-160);y=80+Math.random()*(H*TILE-160);if(walk(x,y)&&!inCitadel(x,y))break}local.orbs.push({x,y,value:10})}
 for(const o of local.orbs)if(Math.hypot(o.x-local.player.x,o.y-local.player.y)<22){local.player.exp+=o.value;o.collected=true;feed(`✨ +${o.value} EXP`)}
 local.orbs=local.orbs.filter(o=>!o.collected);
 while(local.player.exp>=expNeed(local.player.level)){local.player.exp-=expNeed(local.player.level);local.player.level++;local.player.maxHp+=10;local.player.hp=local.player.maxHp;feed(`🔥 Level ${local.player.level}`)}
 for(const e of local.effects)e.life-=dt;local.effects=local.effects.filter(e=>e.life>0);hud(local.player)
}
function players(){return localMode?local.players:(latest?.players||[])}
function drawTile(v,x,y){ctx.fillStyle=v===0?"#3e4938":v===1?"#565656":v===2?"#29482b":v===3?"#29445e":"#1d1d1d";ctx.fillRect(x,y,TILE+1,TILE+1);if(v===1){ctx.fillStyle="#737373";ctx.fillRect(x+5,y+5,22,18)}if(v===2){ctx.fillStyle="#172819";ctx.fillRect(x+13,y+17,6,12);ctx.fillStyle="#3b6b3e";ctx.beginPath();ctx.arc(x+16,y+13,11,0,Math.PI*2);ctx.fill()}if(v===4){ctx.strokeStyle="#454545";ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+16,y+16,11,0,Math.PI*2);ctx.stroke()}}
function render(){
 if(!world)return;ctx.fillStyle="#0b0f0c";ctx.fillRect(0,0,canvas.width,canvas.height);
 const ps=players(),me=ps.find(p=>p.id===(localMode?"local":myId));if(me){camera.x=me.x-canvas.width/2;camera.y=me.y-canvas.height/2}
 camera.x=Math.max(0,Math.min(W*TILE-canvas.width,camera.x));camera.y=Math.max(0,Math.min(H*TILE-canvas.height,camera.y));
 for(let y=Math.max(0,Math.floor(camera.y/TILE)-1);y<=Math.min(H-1,Math.ceil((camera.y+canvas.height)/TILE)+1);y++)for(let x=Math.max(0,Math.floor(camera.x/TILE)-1);x<=Math.min(W-1,Math.ceil((camera.x+canvas.width)/TILE)+1);x++)drawTile(world.tiles[y][x],x*TILE-camera.x,y*TILE-camera.y);
 let cx=W*TILE/2-camera.x,cy=H*TILE/2-camera.y,r=CITADEL*TILE;ctx.fillStyle="rgba(90,75,50,.9)";ctx.beginPath();ctx.arc(cx,cy,r-10,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#d0ad55";ctx.lineWidth=5;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
 const orbs=localMode?local.orbs:(latest?.orbs||[]),bombs=localMode?local.bombs:(latest?.bombs||[]);
 for(const o of orbs){let x=o.x-camera.x,y=o.y-camera.y;ctx.fillStyle="#ffd84d";ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill()}
 for(const b of bombs){let x=b.x-camera.x,y=b.y-camera.y;ctx.fillStyle="#111";ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ffcf3a";ctx.font="bold 10px Arial";ctx.textAlign="center";ctx.fillText(Math.ceil(b.timer),x,y+4)}
 for(const e of local.effects){let x=e.x-camera.x,y=e.y-camera.y,t=1-e.life/e.max;if(e.type==="explosion"){ctx.strokeStyle=`rgba(255,180,50,${1-t})`;ctx.lineWidth=7;ctx.beginPath();ctx.arc(x,y,12+t*70,0,Math.PI*2);ctx.stroke()}else if(e.type==="hit"){ctx.strokeStyle=`rgba(255,80,80,${1-t})`;ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,14+t*18,0,Math.PI*2);ctx.stroke()}else{let d=e.dir||{x:0,y:1},a=Math.atan2(d.y,d.x),s=a-Math.PI*55/180,en=a+Math.PI*55/180;ctx.fillStyle=`rgba(255,255,255,${.16*(1-t)})`;ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,56+t*8,s,en);ctx.closePath();ctx.fill()}}
 for(const p of ps){if(!p.alive)continue;let x=p.x-camera.x,y=p.y-camera.y;ctx.fillStyle=p.id===(localMode?"local":myId)?"#d7b45d":"#e8e8e8";ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="11px Arial";ctx.textAlign="center";ctx.fillText(p.name,x,y-22)}
}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(localMode&&started)updateLocal(dt);else if(started)sendInput();render();requestAnimationFrame(loop)}
const qs=new URLSearchParams(location.search),action=qs.get("guest"),id=(qs.get("id")||"").toUpperCase();
if(location.protocol==="file:"){createLocal()}else{connect();if(action==="create"||action==="join"){$("home").classList.add("hidden");$("modal").classList.add("show");if(action==="join")$("join-id").value=id}}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
